<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="{{A}}theme.css">
<link rel="stylesheet" href="{{A}}blocks.css">
<script>
  // 表示前にテーマとサイドバーの状態を当てて、チラつきを防ぐ
  (function () {
    var r = document.documentElement;
    try {
      var t = localStorage.getItem("hub-theme"); if (t) r.setAttribute("data-theme", t);
      if (localStorage.getItem("hub-pinned") === "1" && matchMedia("(min-width:761px)").matches) r.classList.add("pinned");
    } catch (e) {}
  })();
  window.HUB = { root: "{{ROOT}}", assets: "{{A}}", path: "{{PATH}}" };
</script>
{{HEAD_EXTRA}}
</head>
<body>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="ノート一覧">
  <div class="dr-head">
    <a class="dr-brand" href="{{ROOT}}index.html">{{S1}} <span>{{S2}}</span></a>
    <button type="button" class="dr-close" id="btn-close" aria-label="閉じる">×</button>
  </div>
  <div class="dr-search"><input id="filter" type="search" placeholder="ノート名・中身で検索" autocomplete="off" spellcheck="false"></div>
  <nav class="dr-nav" id="nav"></nav>
  <div class="dr-foot">
    <span>テーマ</span>
    <div class="theme-seg" role="group" aria-label="テーマ">
      <button type="button" data-theme-set="light">ライト</button>
      <button type="button" data-theme-set="dark">ダーク</button>
    </div>
  </div>
</aside>

<div class="page">
  <header class="top"><div class="top-in">
    <button type="button" class="menu" id="btn-menu" aria-label="ノート一覧" aria-controls="drawer"><span></span><span></span><span></span></button>
    {{CRUMB}}
    {{CHIPS}}
    {{FILTERS}}
  </div></header>
  <main class="wrap" id="top">
{{BODY}}
  </main>
</div>

<script src="{{A}}tree.js"></script>
<script src="{{A}}app.js"></script>
{{TAIL}}
</body>
</html>
